[project]
name = "returns-api"
version = "0.1.0"
description = "API de devoluciones para el agente de voz de Venison (FastAPI + PostgreSQL)"
readme = "README.md"
authors = [
    { name = "Alejandro" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "uvicorn[standard]>=0.54.0",
]

# Es una aplicación, no una librería: uv no la empaqueta ni la instala, solo instala sus dependencias.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
